<div class="wrap">
<h1>Three figures</h1>
<p class="sub">Irreducible floor of the three-moment representation. Every value
is regenerated by <code>verify_v8/v10/v11.py</code>; nothing here is retyped.</p>
<figure><div class="ftitle">1 &nbsp;The floor is non-monotone in coupling</div>
<div class="fnote">&sigma;(ln T<sub>c</sub>) over moment-matched spectra, at
r = &omega;&#8322;/&omega;<sub>log</sub> = 1.19 held exactly, 552 donors per rung</div>
<div class="scroll"><svg id="f1" viewBox="0 0 840 380" role="img"
aria-label="Sigma versus lambda, minimum at 0.9 and maximum at 5"></svg></div>
<figcaption><b>Two turning points, not one.</b> A minimum at &lambda; &asymp; 0.90
and a maximum at &lambda; &asymp; 5. The strong-coupling fall is exact — the
asymptote k<sub>B</sub>T<sub>c</sub> &rarr; 0.1827&radic;(&lambda;&langle;&omega;&sup2;&rangle;)
depends only on matched moments — so &sigma; &rarr; 0. The weak-coupling rise is
measured, not derived. Shading marks the window
0.25 &le; T<sub>c</sub>/&omega;<sub>ln</sub> &le; 1.3 that Akis &amp; Carbotte
(1989) identified as anomalously shape-sensitive by a different method; our
maximum sits inside it at T<sub>c</sub>/&omega;<sub>log</sub> = 0.34.</figcaption>
</figure>
<figure><div class="ftitle">2 &nbsp;Headroom diverges as the spectrum approaches Einstein</div>
<div class="fnote">Allen&ndash;Dynes error &divide; floor, matched in shape space
(&plusmn;6% window in r), against r &minus; 1 on log&ndash;log</div>
<div class="scroll"><svg id="f2" viewBox="0 0 840 400" role="img"
aria-label="Headroom versus r minus 1, log-log, rising toward small r"></svg></div>
<figcaption><b>At r = 1 the entire Allen&ndash;Dynes error is learnable.</b> The
moment-matched set collapses to the Einstein spectrum, so &sigma; = 0 exactly by
Jensen and the power-mean inequality, while the error across materials at that r
does not vanish — they still differ in &lambda;. Headroom is therefore unbounded
at one end of its range, which is why the scalar 11.0 is the least useful form of
the answer: it averages over a divergent quantity.
&rho;(r, headroom) = &minus;0.833, p = 0.005.</figcaption>
</figure>
<figure><div class="ftitle">3 &nbsp;The cells cover the declared population in shape, not in coupling</div>
<div class="fnote">520 materials with T<sub>c</sub><sup>ME</sup> &gt; 0.05 K;
the nine floor cells overlaid</div>
<div class="scroll"><svg id="f3" viewBox="0 0 840 420" role="img"
aria-label="Lambda-r plane showing population density and the nine cells"></svg></div>
<figcaption><b>This is the plot that decides which results are exposed.</b> The
two populations' r distributions agree to better than 3% (quantiles
1.081/1.253/1.628 against 1.086/1.244/1.579), so the r-resolved result of
figure 2 is unaffected by the selection cut. Their &lambda; distributions do not:
54.2% of the declared population falls inside the cells' &lambda; range against
86.2% of the population the cells were drawn from. The visible gap at the left
is 41.5% of it; a further 4.2% sits beyond the right-hand cell, and twelve
points with r &gt; 2 fall outside the frame. The direction is unambiguous
either way: the cells straddle figure 1's minimum, so <b>every</b> uncovered
material, on either side, has a larger floor than the cells standing in for
it. The cells understate the declared population's floor, and the scalar
headroom of 11.0 is an overestimate.</figcaption>
</figure>
